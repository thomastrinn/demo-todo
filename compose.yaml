services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432'
  garage:
    image: dxflrs/garage:v2.3.0
    command: /garage server --single-node --default-bucket
    environment:
      - 'GARAGE_DEFAULT_ACCESS_KEY=todoaccesskey'
      - 'GARAGE_DEFAULT_BUCKET=todo-images'
      - 'GARAGE_DEFAULT_SECRET_KEY=todosecretkeytodosecretkey'
    volumes:
      - './garage/garage.toml:/etc/garage.toml:ro'
    ports:
      # A fixed port, because todo.images.endpoint names it.
      - '3900:3900'
