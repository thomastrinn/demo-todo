databaseChangeLog:
  - changeSet:
      id: 004-add-item-search
      author: todo
      changes:
        - sql:
            sql: >-
              ALTER TABLE todo_item ADD COLUMN search_vector tsvector
                  GENERATED ALWAYS AS (
                      setweight(to_tsvector('simple', coalesce(title, '')), 'A') ||
                      setweight(to_tsvector('simple', coalesce(description, '')), 'B')
                  ) STORED
        - sql:
            sql: CREATE INDEX idx_todo_item_search_vector ON todo_item USING GIN (search_vector)
