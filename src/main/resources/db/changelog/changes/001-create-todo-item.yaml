databaseChangeLog:
  - changeSet:
      id: 001-create-todo-item
      author: todo
      changes:
        - createTable:
            tableName: todo_item
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_todo_item
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: done
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated
                  type: timestamptz
                  constraints:
                    nullable: false
